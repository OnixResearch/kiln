[package]
# The unprefixed name belongs to an unrelated crate on crates.io. The binary
# keeps its name, `kiln`.
name = "onix-kiln-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
kiln-codec.workspace = true
kiln-core.workspace = true
kiln-dashboard.workspace = true
kiln-standalone.workspace = true
serde_json.workspace = true

[lints]
workspace = true
