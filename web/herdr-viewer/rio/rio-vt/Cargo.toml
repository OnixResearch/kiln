[package]
name = "rio-vt"
version = "0.6.0"
edition = "2021"
license = "MIT"
publish = false

# Kiln-owned wrapper only; see ../librio/Cargo.toml. Upstream's optional PTY,
# renderer, window, clipboard and image features are not offered.
[lib]
path = "../../../../vendor/rio/rio-vt/src/lib.rs"

[dependencies]
tracing = "0.1.41"
base64 = "0.23.1"
memchr = { version = "2.8.3", default-features = false }
bitflags = "2.9.0"
rustc-hash = "2.1.3"
regex = "1.13.1"
parking_lot = { version = "0.12.5", features = ["nightly", "hardware-lock-elision"] }
serde = { version = "1.0.229", features = ["derive"] }
rio-graphics = { path = "../rio-graphics", version = "0.6.0" }
rio-grapheme-width = { path = "../rio-grapheme-width", version = "0.6.0" }
rio-unicode = { path = "../rio-unicode", version = "0.6.0" }
regex-automata = "0.4.18"
cursor-icon = { version = "1.1.0", default-features = false }
smallvec = { version = "1.15.2", default-features = false }
flate2 = "1.1.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
simdutf = "0.7.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("pty", "renderer", "rio-window", "clipboard", "graphics", "x11", "wayland", "wgpu"))'] }
