<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln fleet</title>
<style>
:root { color-scheme: light dark; --fg:#1c1c1c; --muted:#6b6b6b; --bg:#faf9f7; --panel:#fff; --line:#d9d5cf; --accent:#1f6f8b; --bad:#a33; --ok:#2c6e3f; }
@media (prefers-color-scheme: dark) { :root { --fg:#e8e6e1; --muted:#a4a09a; --bg:#161616; --panel:#1f1f1f; --line:#3a3a3a; --accent:#6fb3c8; --bad:#e08b8b; --ok:#8fcf9f; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 ui-sans-serif,system-ui,sans-serif; }
header { display:flex; gap:1.5rem; align-items:baseline; flex-wrap:wrap; padding:1rem 1.25rem; border-bottom:1px solid var(--line); background:var(--panel); }
h1 { font-size:1.15rem; margin:0; letter-spacing:.02em; }
h2 { font-size:.95rem; margin:0 0 .5rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
main { padding:1rem 1.25rem 3rem; display:grid; gap:1rem; max-width:1200px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1rem; }
section { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:.9rem 1rem; min-width:0; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:.75rem; }
.kpi { border:1px solid var(--line); border-radius:6px; padding:.6rem .75rem; background:var(--panel); }
.kpi b { display:block; font-size:1.5rem; font-variant-numeric:tabular-nums; }
.kpi span { color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.06em; }
table { width:100%; border-collapse:collapse; font-size:.86rem; }
th,td { text-align:left; padding:.35rem .4rem; border-bottom:1px solid var(--line); vertical-align:top; }
th { color:var(--muted); font-weight:600; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; }
td code, .mono { font-family:ui-monospace,monospace; font-size:.78rem; }
button { font:inherit; font-size:.78rem; padding:.2rem .5rem; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); cursor:pointer; }
button:hover { border-color:var(--accent); color:var(--accent); }
button.danger:hover { border-color:var(--bad); color:var(--bad); }
form { display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; margin-top:.5rem; }
input[type=text], input[type=number] { font:inherit; font-size:.82rem; padding:.25rem .4rem; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); min-width:8rem; }
#status { margin-left:auto; color:var(--muted); font-size:.8rem; display:flex; gap:.6rem; align-items:center; }
#dot { width:.6rem; height:.6rem; border-radius:50%; background:var(--ok); display:inline-block; }
#dot.stale { background:var(--bad); }
#error { display:none; border:1px solid var(--bad); color:var(--bad); border-radius:6px; padding:.6rem .75rem; background:var(--panel); }
#error.show { display:block; }
.empty { color:var(--muted); font-style:italic; }
.actions { display:flex; gap:.3rem; flex-wrap:wrap; }
.tag { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:0 .45rem; font-size:.72rem; color:var(--muted); }
.tag.fleet { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Kiln fleet</h1>
  <span id="machine" class="mono"></span>
  <span id="status"><span id="dot"></span><span id="updated">connecting</span></span>
</header>
<main>
  <div id="error" role="alert"></div>
  <div class="kpis">
    <div class="kpi"><b id="kpi-claims">–</b><span>open claims</span></div>
    <div class="kpi"><b id="kpi-ready">–</b><span>ready work</span></div>
    <div class="kpi"><b id="kpi-attempts">–</b><span>attempts</span></div>
    <div class="kpi"><b id="kpi-decisions">–</b><span>open decisions</span></div>
  </div>

  <section>
    <h2>Claims</h2>
    <div id="claims"></div>
    <form id="acquire-form">
      <input type="text" name="scope" placeholder="scope: owner/repo path" required>
      <input type="text" name="purpose" placeholder="purpose" required>
      <input type="number" name="lease" placeholder="minutes" min="1">
      <button type="submit">Acquire</button>
    </form>
  </section>

  <div class="grid">
    <section>
      <h2>Ready work</h2>
      <div id="ready"></div>
    </section>
    <section>
      <h2>Blocked work</h2>
      <div id="blocked"></div>
    </section>
  </div>

  <section>
    <h2>Attempts</h2>
    <div id="attempts"></div>
  </section>

  <section>
    <h2>Decisions</h2>
    <div id="decisions"></div>
  </section>
</main>
<script>
"use strict";
const POLL_MS = 2000;
const state = { claims: null, work: null, attempts: null, decisions: null, error: "" };
const session = (() => {
  try {
    const existing = localStorage.getItem("kiln-fleet-session");
    if (existing) return existing;
    const created = "ui-" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("kiln-fleet-session", created);
    return created;
  } catch (_) { return "ui-session"; }
})();

function esc(value) {
  return String(value == null ? "" : value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function ago(ms) {
  if (typeof ms !== "number" || !isFinite(ms)) return "";
  const delta = Date.now() - ms;
  const abs = Math.abs(delta);
  const unit = abs < 60000 ? [Math.round(abs / 1000), "s"] : abs < 3600000 ? [Math.round(abs / 60000), "m"] : [Math.round(abs / 3600000), "h"];
  return delta >= 0 ? unit[0] + unit[1] + " ago" : "in " + unit[0] + unit[1];
}
function scopeText(scope) {
  if (!scope) return "";
  const target = scope.target;
  const t = typeof target === "string" ? target : (target && (target.repository || target.machine)) || "";
  const p = scope.path;
  const path = typeof p === "string" ? p : (p && p.path) || "";
  return t + (path && path !== "whole" ? " " + path : "");
}
function stateText(value) {
  if (typeof value === "string") return value;
  if (value && typeof value === "object") return Object.keys(value)[0] || JSON.stringify(value);
  return ""; 
}
function empty(text) { return '<p class="empty">' + esc(text) + "</p>"; }
function table(headers, rows, emptyText) {
  if (!rows.length) return empty(emptyText);
  return "<table><thead><tr>" + headers.map((h) => "<th>" + esc(h) + "</th>").join("") + "</tr></thead><tbody>" + rows.join("") + "</tbody></table>";
}

function renderClaims(payload) {
  const claims = (payload && payload.claims) || [];
  const now = Date.now();
  document.getElementById("kpi-claims").textContent = String(claims.filter((c) => stateText(c.state) === "open" && (c.expires_ms || 0) > now).length);
  const rows = claims.map((claim) => {
    const id = esc(claim.identity);
    const actions = '<div class="actions">' +
      '<button data-action="renew" data-id="' + id + '" data-fence="' + esc(claim.fence) + '">Renew</button>' +
      '<button class="danger" data-action="release" data-id="' + id + '" data-fence="' + esc(claim.fence) + '">Release</button>' +
    "</div>";
    return "<tr><td><code>" + id.slice(0, 12) + "</code></td><td>" + esc(scopeText(claim.scope)) + "</td>" +
      "<td>" + esc((claim.holder || {}).tool) + " on " + esc((claim.holder || {}).host) + "<br><span class=\"mono\">" + esc((claim.holder || {}).session) + "</span></td>" +
      "<td>" + esc(claim.purpose) + "</td><td>" + esc(stateText(claim.state)) + "<br><span class=\"mono\">" + esc(ago(claim.expires_ms)) + "</span></td>" +
      "<td>" + actions + "</td></tr>";
  });
  document.getElementById("claims").innerHTML = table(["id", "scope", "holder", "purpose", "expires", ""], rows, "No live claims.");
}

function renderWork(payload) {
  const ready = (payload && payload.ranked) || [];
  document.getElementById("kpi-ready").textContent = String((payload && payload.ready_unclaimed) || 0);
  const readyRows = ready.map((work) => "<tr><td><code>" + esc(work.identity).slice(0, 12) + "</code></td><td>" + esc(work.repository) + "</td><td>" + esc(work.title) + "</td><td>" + (work.interactive ? '<span class="tag fleet">interactive</span>' : "") + "</td></tr>");
  document.getElementById("ready").innerHTML = table(["id", "repository", "title", ""], readyRows, "No ranked work.");
  const blocked = (payload && payload.blocked) || [];
  const blockedRows = blocked.map((work) => "<tr><td><code>" + esc(work.identity).slice(0, 12) + "</code></td><td>" + esc(work.repository) + "</td><td>" + esc(work.title) + "</td><td class=\"mono\">" + esc(JSON.stringify(work.reasons)) + "</td></tr>");
  document.getElementById("blocked").innerHTML = table(["id", "repository", "title", "reasons"], blockedRows, "Nothing blocked.");
}

function renderAttempts(payload) {
  const attempts = (payload && payload.attempts) || [];
  document.getElementById("kpi-attempts").textContent = String(attempts.length);
  const rows = attempts.map((attempt) => {
    const id = esc(attempt.attempt);
    const session = attempt.session || {};
    const actions = '<div class="actions"><button class="danger" data-action="cancel" data-id="' + id + '">Cancel</button></div>';
    return "<tr><td><code>" + id.slice(0, 12) + "</code></td><td>" + esc(stateText(attempt.state)) + "<br><span class=\"mono\">" + esc(stateText(attempt.phase)) + "</span></td>" +
      "<td>" + esc(attempt.repository) + "<br>" + esc(attempt.title) + "</td>" +
      "<td>" + esc(session.machine) + " " + esc(session.agent_name) + "<br><span class=\"mono\">" + esc(stateText(session.state)) + "</span></td>" +
      "<td>" + esc(ago(attempt.lease_expires_ms)) + (attempt.held_by_fleet ? ' <span class="tag fleet">fleet</span>' : "") + "</td><td>" + actions + "</td></tr>";
  });
  document.getElementById("attempts").innerHTML = table(["id", "state", "work", "session", "lease", ""], rows, "No attempts.");
}

function renderDecisions(payload) {
  const decisions = (payload && payload.decisions) || [];
  const open = decisions.filter((d) => !d.answer && d.closed_ms == null);
  document.getElementById("kpi-decisions").textContent = String(open.length);
  if (!decisions.length) { document.getElementById("decisions").innerHTML = empty("No decisions."); return; }
  const rows = decisions.map((decision, index) => {
    const answered = decision.answer != null || decision.closed_ms != null;
    const id = esc(decision.identity);
    const action = answered ? '<span class="tag">answered</span>' :
      '<form data-action="answer" data-id="' + id + '"><input type="text" name="text" placeholder="answer" required><button type="submit">Answer</button></form>';
    return "<tr><td><code>" + id.slice(0, 12) + "</code></td><td>" + esc(decision.question) + "</td><td>" + esc(ago(decision.raised_ms)) + "</td><td>" + action + "</td></tr>";
  });
  document.getElementById("decisions").innerHTML = table(["id", "question", "raised", ""], rows, "No decisions.");
}

async function get(path) {
  const response = await fetch(path, { cache: "no-store", headers: { accept: "application/json" } });
  if (!response.ok) throw new Error(path + ": HTTP " + response.status);
  return response.json();
}

async function poll() {
  try {
    const [health, claims, work, attempts, decisions] = await Promise.all([
      get("/v1/health"), get("/v1/claims"), get("/v1/work"), get("/v1/attempts"), get("/v1/decisions")
    ]);
    document.getElementById("machine").textContent = (health.machine || "") + " · " + (health.version || "");
    renderClaims(claims); renderWork(work); renderAttempts(attempts); renderDecisions(decisions);
    state.error = "";
    document.getElementById("error").classList.remove("show");
    document.getElementById("dot").classList.remove("stale");
    document.getElementById("updated").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (error) {
    state.error = String(error && error.message ? error.message : error);
    const banner = document.getElementById("error");
    banner.textContent = "Fleet unavailable: " + state.error;
    banner.classList.add("show");
    document.getElementById("dot").classList.add("stale");
    document.getElementById("updated").textContent = "stale";
  }
}

async function post(path, body) {
  const response = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const text = await response.text();
  let parsed = {};
  try { parsed = text ? JSON.parse(text) : {}; } catch (_) { parsed = { raw: text }; }
  if (!response.ok) throw new Error(parsed.error || ("HTTP " + response.status));
  return parsed;
}

document.addEventListener("click", async (event) => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;
  const action = button.dataset.action;
  const id = button.dataset.id;
  try {
    if (action === "renew") {
      const minutes = prompt("Lease minutes (blank keeps the policy default)");
      if (minutes === null) return;
      const body = { fence: Number(button.dataset.fence) };
      if (minutes.trim() !== "") body.lease_minutes = Number(minutes);
      await post("/v1/claims/" + id + "/renew", body);
    } else if (action === "release") {
      const note = prompt("Release note") || "";
      await post("/v1/claims/" + id + "/release", { fence: Number(button.dataset.fence), note });
    } else if (action === "cancel") {
      const reason = prompt("Cancel reason");
      if (reason === null) return;
      await post("/v1/attempts/" + id + "/cancel", { reason });
    }
    await poll();
  } catch (error) {
    alert(String(error && error.message ? error.message : error));
  }
});

document.addEventListener("submit", async (event) => {
  const form = event.target;
  if (form.id === "acquire-form") {
    event.preventDefault();
    const data = new FormData(form);
    const body = { scope: data.get("scope"), purpose: data.get("purpose"), tool: "kiln-fleet-ui", session };
    const lease = String(data.get("lease") || "").trim();
    if (lease) body.lease_minutes = Number(lease);
    try { await post("/v1/claims", body); form.reset(); await poll(); }
    catch (error) { alert(String(error && error.message ? error.message : error)); }
    return;
  }
  if (form.dataset.action === "answer") {
    event.preventDefault();
    const data = new FormData(form);
    try { await post("/v1/decisions/" + form.dataset.id + "/answer", { text: data.get("text") }); await poll(); }
    catch (error) { alert(String(error && error.message ? error.message : error)); }
  }
});

document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
