[package]
name = "kiln-web-service-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.88"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
url = "2.5.8"
kiln-web-service = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "feed_parse"
path = "fuzz_targets/feed_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "opml_parse"
path = "fuzz_targets/opml_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "atom_roundtrip"
path = "fuzz_targets/atom_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "opml_roundtrip"
path = "fuzz_targets/opml_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rss_roundtrip"
path = "fuzz_targets/rss_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "admit_url"
path = "fuzz_targets/admit_url.rs"
test = false
doc = false
bench = false

