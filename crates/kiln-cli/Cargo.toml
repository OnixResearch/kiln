[package]
# The unprefixed name belongs to an unrelated crate on crates.io. The binary
# keeps its name, `kiln`.
name = "onix-kiln-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "kiln"
path = "src/main.rs"

[dependencies]
bounded-exec.workspace = true
kiln-codec.workspace = true
kiln-core.workspace = true
kiln-dashboard.workspace = true
kiln-standalone.workspace = true
kiln-adapter-git.workspace = true
kiln-implementer.workspace = true
kiln-adapter-cairn.workspace = true
kiln-web-service = { path = "../kiln-web-service" }
git2.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook = "0.3.18"

[lints]
workspace = true
