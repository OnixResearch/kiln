[package]
name = "rio-graphics"
version = "0.6.0"
edition = "2021"
license = "MIT"
publish = false

# Kiln-owned wrapper only; see ../librio/Cargo.toml. Upstream's optional
# image, glyph and wgpu features are not offered.
[lib]
path = "../../../../vendor/rio/rio-graphics/src/lib.rs"

[dependencies]
tracing = "0.1.41"
rustc-hash = "2.1.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("image", "glyph", "wgpu"))'] }
