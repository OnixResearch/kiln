[package]
name = "onix-radicle-cob-git-store"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
git2 = { version = "=0.21.0", features = ["vendored-libgit2"], default-features = false }
radicle-cob = { version = "=0.21.1", default-features = false, features = ["git2"] }
radicle-crypto = { version = "=0.19.0", default-features = false, features = ["ssh", "alloc", "multibase"] }
radicle-git-ref-format = { version = "=0.2.0", default-features = false }
radicle-oid = { version = "=0.2.2", default-features = false, features = ["git2", "serde", "sha1", "std"] }
thiserror = "2"

[dev-dependencies]
nonempty = "=0.9.0"
tempfile = "3"
