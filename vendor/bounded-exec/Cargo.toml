[workspace]
resolver = "2"
members = [
  "crates/bounded-exec-core",
  "crates/bounded-exec",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/OnixResearch/bounded-exec"
publish = false

[workspace.dependencies]
bounded-exec-core = { path = "crates/bounded-exec-core" }
nix = { version = "0.30.1", default-features = false, features = ["process", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
