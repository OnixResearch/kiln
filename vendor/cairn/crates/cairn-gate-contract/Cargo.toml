[package]
name = "cairn-gate-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Versioned no-std gate request and result contract for Cairn consumers"
publish = false

[dependencies]
blake3 = { version = "1.8.2", default-features = false, features = ["pure"] }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
