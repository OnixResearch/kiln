[workspace]
members = ["rat-table"]
resolver = "2"

[package]
name = "kiln-dashboard-index"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rat-table = { path = "rat-table" }
ratatui = { version = "=0.30.1", default-features = false, features = ["std"] }
ratzilla = "=0.3.1"
wasm-bindgen = "=0.2.121"
js-sys = "=0.3.98"
web-sys = { version = "=0.3.98", features = ["CustomEvent", "CustomEventInit", "Document", "DomRect", "Element", "Event", "EventTarget", "HtmlElement", "KeyboardEvent", "MouseEvent", "Node", "Window", "console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
