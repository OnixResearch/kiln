[package]
name = "librio"
version = "0.6.0"
edition = "2021"
license = "MIT"
publish = false

# Kiln-owned wrapper only: the imported Rio source and manifests stay
# byte-for-byte pristine. A package inside this workspace gets a
# checkout-independent Cargo metadata hash, so the WASM is reproducible.
# The PTY and graphics features (and their dependencies) are not offered.
[lib]
path = "../../../../vendor/rio/librio/src/lib.rs"

[dependencies]
rio-vt = { path = "../rio-vt", version = "0.6.0" }
rio-fonts = { path = "../rio-fonts", version = "0.6.0", features = ["symbols-nerd-font"] }
rio-graphics = { path = "../rio-graphics", version = "0.6.0" }
rustc-hash = "2.1.3"
bitflags = "2.9.0"
tracing = "0.1.41"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("pty", "graphics"))'] }
