[package]
name = "kiln-fleet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "kiln_fleet"
path = "src/lib.rs"

[[bin]]
name = "kiln-fleet"
path = "src/main.rs"

[dependencies]
blake3.workspace = true
bounded-exec.workspace = true
kiln-adapter-herdr.workspace = true
kiln-adapter-swarm = { path = "../kiln-adapter-swarm" }
kiln-core.workspace = true
kiln-implementer.workspace = true
nix = { version = "=0.30.1", features = ["process", "signal"] }
serde.workspace = true
serde_json.workspace = true
signal-hook = "0.3.18"
socket2 = "0.6"

[dev-dependencies]
tempfile = "3.27.0"
kiln-adapter-basalt = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
