[package]
name = "ucan-nostr"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Optional bounded Nostr key-control verification adapter for UCAN consumers."
repository = "https://github.com/OnixResearch/ucan"
readme = "../../README.md"
keywords = ["ucan", "nostr", "authentication"]
categories = ["authentication"]

[dependencies]
blake3 = "=1.8.4"
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"

[lints]
workspace = true
