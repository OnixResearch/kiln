[workspace]
members = ["crates/ucan-core", "crates/ucan-nostr"]
exclude = ["vendor/verified-logic"]
resolver = "2"

[workspace.metadata.tigerstyle]
default_scope = ["-p", "ucan", "-p", "ucan-core", "-p", "ucan-nostr"]
cargo_check_args = ["--workspace", "--all-targets"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

[package]
name = "ucan"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "UCAN token and authority primitives with explicit consumer-owned boundaries."
repository = "https://github.com/OnixResearch/ucan"
readme = "README.md"
keywords = ["ucan", "capabilities", "authorization"]
categories = ["authentication"]

[[bin]]
name = "check-production-readiness"
path = "tools/check-production-readiness/main.rs"

[[bin]]
name = "check-aeneas-time-bounds-proof"
path = "tools/check-aeneas-time-bounds-proof/main.rs"

[features]
default = ["durable-authority"]
durable-authority = ["dep:replay-ledger-core", "dep:revocation-view-core"]

[dependencies]
base64 = "0.22"
blake3 = "1.5"
ed25519-dalek = "=2.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
snafu = "0.8"
replay-ledger-core = { git = "https://seed.radicle.garden/z3kGDT73ja8rewvGLwJFLF5MTx1ih.git", rev = "a0de79303f3f45c18a34fff535b690a85cb3cf59", optional = true }
revocation-view-core = { git = "https://seed.radicle.garden/z3kGDT73ja8rewvGLwJFLF5MTx1ih.git", rev = "a0de79303f3f45c18a34fff535b690a85cb3cf59", optional = true }
ucan-core = { path = "crates/ucan-core", default-features = false, features = ["verification-cache"] }
zeroize = "=1.9.0"
verified-logic = { path = "vendor/verified-logic" }

[dev-dependencies]
hegeltest = "0.2"
transactional-reconciliation-core = { git = "https://seed.radicle.garden/z4Tky6zvC8w4Y6c4YBzNxVbq5n752.git", rev = "eb2bd3441753af97bfcb247cef7cc22d72675b62" }
pretty_assertions = "1.0"
proptest = "1.0"
tempfile = "3"

[lints]
workspace = true
