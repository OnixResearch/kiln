[workspace]
resolver = "3"
members = [
  "crates/kiln-adapter-aspen",
  "crates/kiln-aspen-extension",
]

[workspace.metadata.octet]
default_scope = ["--workspace"]
cargo_check_args = ["--all-targets", "--all-features"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
version = "0.1.0"

[workspace.dependencies]
blake3 = "=1.8.6"
preserves = { version = "=5.0.0-rc.7", features = ["serde"] }
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
kiln-core = { path = "@KILN_SOURCE@/crates/kiln-core" }
kiln-provider-api = { path = "@KILN_SOURCE@/crates/kiln-provider-api" }
kiln-codec = { path = "@KILN_SOURCE@/crates/kiln-codec" }
kiln-adapter-aspen = { path = "crates/kiln-adapter-aspen" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
