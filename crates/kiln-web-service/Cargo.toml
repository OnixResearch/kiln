[package]
name = "kiln-web-service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64.workspace = true
blake3.workspace = true
bounded-exec.workspace = true
bounded-exec-core.workspace = true
fs2.workspace = true
git2.workspace = true
cob-git2.workspace = true
nonempty.workspace = true
onix-radicle-cob-git-store.workspace = true
radicle-cob.workspace = true
radicle-crypto.workspace = true
radicle-oid.workspace = true
hmac = "0.12.1"
# Calendar schedules: exact pin with only the bundled IANA tzdb (jiff-tzdb
# 0.1.8, tzdb 2026c); host zoneinfo is never read. See LICENSES.md.
jiff = { version = "=0.2.35", default-features = false, features = ["std", "tzdb-bundle-always"] }
kiln-adapter-git.workspace = true
kiln-adapter-github = { path = "../kiln-adapter-github" }
kiln-adapter-http-observe.workspace = true
kiln-adapter-jj.workspace = true
kiln-adapter-lattice.workspace = true
kiln-adapter-webhook.workspace = true
kiln-build-graph.workspace = true
kiln-codec.workspace = true
kiln-core.workspace = true
kiln-highlight.workspace = true
kiln-observe-core.workspace = true
kiln-provider-api.workspace = true
lattice-workflow-transport.workspace = true
libc = "0.2"
nix = { version = "=0.30.1", features = ["fs", "user", "process", "signal", "resource"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls", "json"] }
roxmltree = "=0.20.0"
rusqlite.workspace = true
rustix = { version = "=1.1.4", features = ["fs"] }
rustls.workspace = true
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
getrandom.workspace = true
serde_ignored = "0.1.14"
sha2 = "0.10.9"
signal-hook = "0.3.18"
tempfile = "3.27.0"
zeroize.workspace = true

[features]
# Change-ID intake tests over fixture repositories built by a real `jj`
# (KILN_JJ_EXE, else `jj` on PATH).
jj-fixtures = ["kiln-adapter-jj/jj-fixtures"]

[dev-dependencies]
parking_lot = "0.12.5"

[lints]
workspace = true
